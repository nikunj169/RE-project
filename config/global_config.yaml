# Global configuration for revised TCO2 symbolic regression study
# All analysis parameters are defined here for reproducibility

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  raw_data: "data/raw/GLODAPv2.2023_Merged_Master_File.mat"
  processed_data: "data/processed"
  results_raw: "results/raw"
  results_processed: "results/processed"
  results_tables: "results/tables"
  results_figures: "results/figures"
  models: "models"
  logs: "logs"

# ── Variables ─────────────────────────────────────────────────────────────────
variables:
  predictors:
    salinity: "G2salinity"
    temperature: "G2temperature"
    aou: "G2aou"
  target: "G2tco2"
  metadata:
    latitude: "G2latitude"
    longitude: "G2longitude"
    depth: "G2depth"
    year: "G2year"
    month: "G2month"
    region: "G2region"
    cruise: "G2cruise"
    station: "G2station"

# ── Quality Control ───────────────────────────────────────────────────────────
quality_control:
  require_finite: true
  salinity:
    min: 25.0
    max: 42.0
  temperature:
    min: -2.5
    max: 35.0
  tco2:
    min: 1700.0
    max: 2600.0
  aou:
    min: -50.0

# ── Basin Definitions ─────────────────────────────────────────────────────────
basins:
  Atlantic:
    region_codes: [1]
    lat_min: -35.0
    color: "#1f77b4"
  Indian:
    region_codes: [16]
    lat_min: -35.0
    color: "#2ca02c"
  Pacific:
    region_codes: [8]
    lat_min: -35.0
    color: "#ff7f0e"
  SouthernOcean:
    region_codes: null  # all regions
    lat_max: -35.0
    color: "#9467bd"

# ── Temporal Split ────────────────────────────────────────────────────────────
temporal_split:
  train_end_year: 2015      # train: year < 2015
  validation_end_year: 2018 # validation: 2015 <= year < 2018
  # external holdout: year >= 2018

# ── Depth Bins ────────────────────────────────────────────────────────────────
depth_bins:
  edges: [0, 100, 500, 1000, 3000, 7000]
  labels: ["0-100m", "100-500m", "500-1000m", "1000-3000m", "3000-7000m"]

# ── Random Seeds ──────────────────────────────────────────────────────────────
random_seeds: [42, 123, 456, 789, 1024, 2048, 4096, 8192]
primary_seed: 42

# ── Bootstrap ─────────────────────────────────────────────────────────────────
bootstrap:
  n_replicates: 1000
  confidence_level: 0.95
  cluster_block_size_deg: 5  # degrees latitude/longitude for spatial blocking

# ── Equivalence Testing ──────────────────────────────────────────────────────
equivalence:
  margins_umol_kg: [1.0, 2.0, 5.0, 10.0]
  alpha: 0.05

# ── AOU Scaling ──────────────────────────────────────────────────────────────
aou_scaling:
  divisor: 100.0  # AOU/100 in the model
  alternative_divisors: [10.0, 100.0]  # for robustness testing

# ── Model Fitting ────────────────────────────────────────────────────────────
fitting:
  curve_fit_maxfev: 30000
  curve_fit_p0:
    alpha: 1.0
    beta: -0.3
    gamma: 2.5
    delta: 20.0
    epsilon: 2000.0
